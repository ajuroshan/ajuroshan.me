name: release

# Tag vX.Y.Z (via `npm version <patch|minor|major>` + `git push --follow-tags`)
# -> build -> GitHub Release with notes + site tarball -> the server pulls it (see `live` job).
# Rebuild an existing release's tarball: Actions -> release -> Run workflow -> tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)deploy, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: tag matches package.json
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$v" = "$TAG" ] || { echo "::error::tag $TAG != package.json $v"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_VERSION: ${{ env.TAG }}
      - run: tar -czf "ajuroshan.me-$TAG.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ajuroshan.me-${{ env.TAG }}.tar.gz

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ajuroshan.me-$TAG.tar.gz" --clobber
          else
            gh release create "$TAG" "ajuroshan.me-$TAG.tar.gz" \
              --title "$TAG" --generate-notes --verify-tag
          fi

  # The web host pulls the latest release itself (site-pull-deploy timer on the box, every 2 min):
  # it checks the asset's sha256 digest, swaps the `current` symlink and health-checks locally.
  # Nothing here can reach the server, so there are no deploy keys. This job just waits for it to go live.
  # Roll back: `gh release edit vX.Y.Z --latest` on an older release.
  live:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ajmalroshan.dev
    steps:
      - name: wait for the server to pull this release
        run: |
          for i in $(seq 1 40); do
            curl -fsS "https://ajmalroshan.dev/?v=$TAG-$i" | grep -q "$TAG" && { echo "live: $TAG"; exit 0; }
            sleep 15
          done
          echo "::error::$TAG not live after 10 minutes (is it marked latest? check site-pull-deploy on the box)"; exit 1
