name: release

# Tag vX.Y.Z (via `npm version <patch|minor|major>` + `git push --follow-tags`)
# -> build -> GitHub Release with notes + site tarball -> deploy that exact build.
# Re-deploy an existing release: Actions -> release -> Run workflow -> tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)deploy, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: tag matches package.json
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$v" = "$TAG" ] || { echo "::error::tag $TAG != package.json $v"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_VERSION: ${{ env.TAG }}
      - run: tar -czf "ajuroshan.me-$TAG.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ajuroshan.me-${{ env.TAG }}.tar.gz

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ajuroshan.me-$TAG.tar.gz" --clobber
          else
            gh release create "$TAG" "ajuroshan.me-$TAG.tar.gz" \
              --title "$TAG" --generate-notes --verify-tag
          fi

  deploy:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://129.225.66.211
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: deploy.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          name: site
      - run: mkdir dist && tar -xzf "ajuroshan.me-$TAG.tar.gz" -C dist
      - name: ssh setup
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - run: ./deploy.sh
        env:
          SKIP_BUILD: '1'
          RELEASE: ${{ env.TAG }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      - name: smoke test
        run: |
          for i in 1 2 3; do
            curl -fsS http://129.225.66.211/ | grep -q "$TAG" && { echo "live: $TAG"; exit 0; }
            sleep 3
          done
          echo "::error::$TAG not visible on the live site"; exit 1
