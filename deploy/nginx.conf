# /etc/nginx/sites-available/ajmalroshan.dev  (symlinked into sites-enabled; the old ajuroshan.me file is removed)
# Only reachable through the Cloudflare tunnel on the private address; Cloudflare terminates TLS.
server {
    listen 10.0.0.201:80 default_server;
    server_name ajmalroshan.dev www.ajmalroshan.dev ajuroshan.me www.ajuroshan.me 129.225.66.211 _;
    root /var/www/ajuroshan.me/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/ajmalroshan.visits.log visits;

    # the old domain and www: one hop to the canonical host
    if ($host ~* ^(www\.ajmalroshan\.dev|(www\.)?ajuroshan\.me)$) { return 301 https://ajmalroshan.dev$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

    location = /status.json {
        alias /var/www/status/status.json;
        add_header Cache-Control "public, max-age=30";
        add_header Access-Control-Allow-Origin "*";
        default_type application/json;
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(woff2?|svg|ico|png|jpg|webp|avif|txt|xml)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
